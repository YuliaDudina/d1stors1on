<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background-image: url("assets/d1stors1on_background_web.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.mail-button {
  position: absolute;
  top: 9%;
  right: 6%;
  width: 15vw;
  min-width: 120px;
  max-width: 400px;
  height: auto;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.mail-button:hover {
  animation: wiggle 0.4s ease-in-out;
}

@keyframes wiggle {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-8deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}
</style>
</head>
<body>

<a href="mailto:d1stors1on.graphicdesign@gmail.com">
<img src="assets/button_mail.png" alt="contact us" class="mail-button">
</a>

</body>
</html>

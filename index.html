<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/d1stors1on_icon.ico">
<link rel="icon" href="assets/d1stors1on_icon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>d1stors1on graphic design</title>
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
}

body {
background-image: url("assets/d1stors1on_background_web.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
cursor: url("assets/mouse_heart.png") 0 0, auto;
}

.nav-button {
position: absolute;
top: 9%;
height: 6.5vh;
min-height: 10px;
max-height: 160px;
width: auto;
cursor: pointer;
transition: transform 0.2s ease;
}

.nav-button:hover {
animation: wiggle 0.4s ease-in-out;
}

.mail-button {
right: 7%;
}

.about-button {
right: 32%;
}

.works-button {
right: 43%;
}

.insta-button {
left: 6%;
}

@keyframes wiggle {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-8deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}
</style>
</head>
<body>

<a href="works.html">
<img src="assets/button_works.png" alt="works" class="nav-button works-button">
</a>

<a href="about.html">
<img src="assets/button_about.png" alt="about" class="nav-button about-button">
</a>

<a href="mailto:d1stors1on.graphicdesign@gmail.com">
<img src="assets/button_mail.png" alt="contact us" class="nav-button mail-button">
</a>

<a href="https://www.instagram.com/d1stors1on_design/">
<img src="assets/insta.png" alt="open instagram page" class="nav-button insta-button">
</a>

</body>
</html>

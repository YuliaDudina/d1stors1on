<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/d1stors1on_icon.ico">
<link rel="icon" href="assets/d1stors1on_icon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
}

body {
background-image: url("assets/d1stors1on_background_web_about.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
cursor: url("assets/mouse_heart.png") 0 0, auto;
}

.home-button {
position: absolute;
top: 8%;
right: 3%;
transform: translateX(-50%);
height: 6.5vh;
min-height: 40px;
max-height: 160px;
width: auto;
cursor: pointer;
transition: transform 0.2s ease;
}

.home-button:hover {
animation: wiggle 0.4s ease-in-out;
}

@keyframes wiggle {
  0% { transform: translateX(-50%) rotate(0deg); }
  20% { transform: translateX(-50%) rotate(-8deg); }
  40% { transform: translateX(-50%) rotate(8deg); }
  60% { transform: translateX(-50%) rotate(-6deg); }
  80% { transform: translateX(-50%) rotate(6deg); }
  100% { transform: translateX(-50%) rotate(0deg); }
}
</style>
</head>
<body>

<a href="index.html">
<img src="assets/button_home.png" alt="home" class="home-button">
</a>

</body>
</html>
